services:
  casdoor:
    #image: casbin/casdoor:latest
    build:
      context: ./
      dockerfile: Dockerfile
      target: STANDARD
    entrypoint: /bin/sh -c './server --createDatabase=true'
    container_name: casdoor
    restart: unless-stopped
    ports:
      - "8000:8000"
    depends_on:
      - db
    environment:
      - GIN_MODE=release
      - RUNNING_IN_DOCKER=true
    volumes:
      - ./conf:/conf
      - ./logs:/logs
    networks:
      - casdoor-network
  db:
    image: mysql:8.4
    platform: linux/amd64
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: 123456
    volumes:
      - ./db/mysql:/var/lib/mysql
    networks:
      - casdoor-network

networks:
  casdoor-network:
    driver: bridge
